name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: trunkcms:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Start the image against the test fixture and make sure it serves pages.
      - name: Smoke test
        run: |
          docker run -d --name trunkcms -p 8080:8080 \
            -e TRUNKCMS_CONTENT_DIR=/site -v "$PWD/testdata/site:/site:ro" trunkcms:ci
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8080/
          curl -sf -o /dev/null http://localhost:8080/posts/hello-world/
      - name: Container logs
        if: always()
        run: docker logs trunkcms || true
