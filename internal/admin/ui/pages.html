{{define "content"}}
<div class="head">
  <h1>Pages</h1>
  <a class="button primary" href="/admin/new?kind=page">New page</a>
</div>
<table class="list">
  <thead><tr><th>Title</th><th>URL</th><th>File</th></tr></thead>
  <tbody>
  {{range .Data}}
    <tr>
      <td><a href="/admin/edit?path={{.Path}}">{{.Meta.Title}}</a></td>
      <td><a href="{{.URL}}" target="_blank" rel="noopener">{{.URL}}</a></td>
      <td><code>{{.Path}}</code></td>
    </tr>
  {{else}}
    <tr><td colspan="3" class="muted">No pages yet.</td></tr>
  {{end}}
  </tbody>
</table>
{{end}}
